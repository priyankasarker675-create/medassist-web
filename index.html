<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MedAssist - Prescription OCR</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>


<style>

/* ==================================================
   BASIC
================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5fafb;
  color: #173b3d;
}

.container {
  width: 100%;
  max-width: 650px;
  margin: auto;
  padding: 0 16px 50px;
}


/* ==================================================
   HEADER
================================================== */

.header {
  background: #109b96;
  color: white;
  text-align: center;
  padding: 30px 15px;
  margin: 0 -16px 25px;
  border-radius: 0 0 35px 35px;
}

.header h1 {
  margin: 0;
  font-size: 34px;
}

.header p {
  margin: 8px 0 0;
  font-size: 16px;
}


/* ==================================================
   CARD
================================================== */

.card {
  background: white;
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.title {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 8px;
}

.description {
  color: #687878;
  line-height: 1.5;
  margin-bottom: 20px;
}


/* ==================================================
   FILE PICKER
================================================== */

/*
IMPORTANT:
There is NO capture="environment".
Therefore the phone will NOT automatically open camera.
*/

#imageInput {
  display: none;
}

.upload-button {
  display: block;
  width: 100%;
  padding: 18px;
  background: #109b96;
  color: white;
  border-radius: 18px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}


/* ==================================================
   IMAGE PREVIEW
================================================== */

#preview {
  display: none;
  width: 100%;
  max-height: 550px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 18px;
  background: #f2f2f2;
}


/* ==================================================
   BUTTONS
================================================== */

button {
  width: 100%;
  border: none;
  border-radius: 20px;
  padding: 18px;
  margin-top: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#ocrButton {
  background: #109b96;
  color: white;
}

#ocrButton:disabled {
  background: #9dbfbd;
  cursor: not-allowed;
}

#resetButton {
  background: #e5f4f5;
  color: #087f7b;
}

#copyButton {
  background: #e5f4f5;
  color: #087f7b;
}


/* ==================================================
   STATUS
================================================== */

#status {
  margin-top: 15px;
  padding: 15px;
  background: #e5f4f5;
  color: #087f7b;
  border-radius: 14px;
  text-align: center;
  font-weight: bold;
  min-height: 50px;
  line-height: 1.
