<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MedAssist - Prescription OCR</title>

  <!-- Tesseract.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7fbfc;
      color: #173b3d;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 8px;
      color: #087f7b;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #667;
      margin-bottom: 25px;
    }

    .image-box {
      background: white;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    #preview {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      display: none;
    }

    .upload-label {
      display: block;
      background: #109b96;
      color: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #imageInput {
      display: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 18px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #ocrBtn {
      background: #109b96;
      color: white;
    }

    #ocrBtn:disabled {
      background: #9bbfbd;
      cursor: not-allowed;
    }

    #chooseBtn {
      background: #e7f5f6;
      color: #087f7b;
    }

    .progress-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      background: #e7f5f6;
      color: #087f7b;
      text-align: center;
      font-weight: bold;
      min-height: 45px;
    }

    .result-title {
      margin-top: 28px;
      font-size: 23px;
      font-weight: bold;
    }

    #result {
      width: 100%;
      min-height: 240px;
      margin-top: 12px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: white;
      font-size: 17px;
      line-height: 1.7;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    #copyBtn {
      background: #e7f5f6;
      color: #087f7b;
    }

    .medicine-box {
      display: none;
      margin-top: 20px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .medicine-box h3 {
      margin-top: 0;
      color: #087f7b;
    }

    .medicine {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-weight: bold;
    }

    .error-box {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 12px;
      color: #a00000;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 12px;
      font-size: 13px;
      color: #665500;
      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>💊 MedAssist</h1>

  <div class="subtitle">
    Your Smart Medicine Assistant
  </div>


  <!-- IMAGE AREA -->

  <div class="image-box">

    <label
      class="upload-label"
      for="imageInput"
    >
      📷 Choose Prescription Image
    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img
      id="preview"
      alt="Prescription Preview"
    >

  </div>


  <!-- OCR BUTTON -->

  <button
    id="ocrBtn"
    disabled
  >
    🔍 Start OCR
  </button>


  <!-- CHOOSE ANOTHER -->

  <button
    id="chooseBtn"
  >
    ✕ Choose Another Image
  </button>


  <!-- PROGRESS -->

  <div
    id="progress"
    class="progress-box"
  >
    Please choose a prescription image.
  </div>


  <!-- ERROR -->

  <div
    id="errorBox"
    class="error-box"
  ></div>


  <!-- RESULT -->

  <div class="result-title">
    📝 OCR Result
  </div>


  <textarea
    id="result"
    placeholder="OCR result will appear here..."
    readonly
  ></textarea>


  <!-- COPY -->

  <button
    id="copyBtn"
  >
    📋 Copy Text
  </button>


  <!-- MEDICINES -->

  <div
    class="medicine-box"
    id="medicineBox"
  >

    <h3>
      💊 Detected Medicines
    </h3>

    <div id="medicineList"></div>

  </div>


  <!-- WARNING -->

  <div class="note">

    ⚠️ OCR শুধু prescription-এর লেখা শনাক্ত করার জন্য।
    OCR ভুল medicine name বা dosage শনাক্ত করতে পারে।
    কোনো ওষুধ গ্রহণের আগে অবশ্যই doctor/pharmacist-এর
    prescription যাচাই করুন।

  </div>

</div>



<script>


/* =====================================================
   ELEMENTS
===================================================== */

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const ocrBtn =
  document.getElementById("ocrBtn");

const chooseBtn =
  document.getElementById("chooseBtn");

const result =
  document.getElementById("result");

const progress =
  document.getElementById("progress");

const copyBtn =
  document.getElementById("copyBtn");

const medicineBox =
  document.getElementById("medicineBox");

const medicineList =
  document.getElementById("medicineList");

const errorBox =
  document.getElementById("errorBox");


let selectedImage = null;



/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(event) {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }


    /* Check image */

    if (!file.type.startsWith("image/")) {

      showError(
        "Please select a valid image file."
      );

      return;
    }


    selectedImage = file;


    /* Preview */

    const imageURL =
      URL.createObjectURL(file);

    preview.src = imageURL;

    preview.style.display =
      "block";


    /* Enable OCR */

    ocrBtn.disabled =
      false;


    /* Clear old result */

    result.value = "";

    medicineList.innerHTML = "";

    medicineBox.style.display =
      "none";

    errorBox.style.display =
      "none";


    progress.textContent =
      "✅ Image ready. Press Start OCR.";

  }
);



/* =====================================================
   CHOOSE ANOTHER IMAGE
===================================================== */

chooseBtn.addEventListener(
  "click",
  function() {

    imageInput.value = "";

    selectedImage = null;

    preview.src = "";

    preview.style.display =
      "none";

    result.value = "";

    medicineList.innerHTML = "";

    medicineBox.style.display =
      "none";

    errorBox.style.display =
      "none";

    ocrBtn.disabled =
      true;

    progress.textContent =
      "Please choose a prescription image.";

  }
);



/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  errorBox.style.display =
    "block";

  errorBox.textContent =
    "❌ " + message;

}



/* =====================================================
   IMAGE PREPROCESSING
===================================================== */

function preprocessImage(file) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();


      img.onload =
        function() {

          try {

            const canvas =
              document.createElement(
                "canvas"
              );

            const ctx =
              canvas.getContext(
                "2d"
              );


            let width =
              img.naturalWidth;

            let height =
              img.naturalHeight;


            /*
              Keep image reasonably large.
            */

            const maxWidth = 2000;


            if (width > maxWidth) {

              const ratio =
                maxWidth / width;

              width =
                maxWidth;

              height =
                Math.round(
                  height * ratio
                );

            }


            canvas.width =
              width;

            canvas.height =
              height;


            /*
              Draw image
            */

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            /*
              Get pixels
            */

            const imageData =
              ctx.getImageData(
                0,
                0,
                width,
                height
              );


            const data =
              imageData.data;


            /*
              Grayscale + contrast
            */

            for (
              let i = 0;
              i < data.length;
              i += 4
            ) {

              const r =
                data[i];

              const g =
                data[i + 1];

              const b =
                data[i + 2];


              let gray =
                (0.299 * r) +
                (0.587 * g) +
                (0.114 * b);


              /*
                Contrast
              */

              gray =
                ((gray - 128) * 1.25) +
                128;


              gray =
                Math.max(
                  0,
                  Math.min(
                    255,
                    gray
                  )
                );


              data[i] =
                gray;

              data[i + 1] =
                gray;

              data[i + 2] =
                gray;

            }


            ctx.putImageData(
              imageData,
              0,
              0
            );


            /*
              Return processed image
            */

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.95
              )
            );

          }

          catch(error) {

            reject(error);

          }

        };


      img.onerror =
        function() {

          reject(
            new Error(
              "Could not load selected image."
            )
          );

        };


      img.src =
        URL.createObjectURL(file);

    }
  );

}



/* =====================================================
   START OCR
===================================================== */

ocrBtn.addEventListener(
  "click",
  async function() {


    if (!selectedImage) {

      alert(
        "Please choose a prescription image first."
      );

      return;
    }


    /*
      Disable button
    */

    ocrBtn.disabled =
      true;


    result.value =
      "";


    errorBox.style.display =
      "none";


    medicineBox.style.display =
      "none";


    medicineList.innerHTML =
      "";


    try {


      /* -----------------------------------------
         CHECK TESSERACT
      ----------------------------------------- */

      if (
        typeof Tesseract ===
        "undefined"
      ) {

        throw new Error(
          "Tesseract.js could not be loaded. Please check your internet connection."
        );

      }


      /* -----------------------------------------
         PREPROCESS
      ----------------------------------------- */

      progress.textContent =
        "⏳ Preparing prescription image...";


      const processedImage =
        await preprocessImage(
          selectedImage
        );


      /* -----------------------------------------
         CREATE WORKER
      ----------------------------------------- */

      progress.textContent =
        "🔄 Loading OCR engine...";


      const worker =
        await Tesseract.createWorker(
          "eng",
          1,
          {

            workerPath:
              "https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/worker.min.js",

            langPath:
              "https://tessdata.projectnaptha.com/4.0.0",

            corePath:
              "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.5",

            logger:
              function(info) {

                if (
                  info &&
                  info.status
                ) {

                  let percent =
                    "";


                  if (
                    typeof info.progress ===
                    "number"
                  ) {

                    percent =
                      " " +
                      Math.round(
                        info.progress * 100
                      ) +
                      "%";

                  }


                  progress.textContent =
                    "🔍 " +
                    info.status +
                    percent;

                }

              }

          }
        );


      /* -----------------------------------------
         OCR PARAMETERS
      ----------------------------------------- */

      try {

        await worker.setParameters({

          preserve_interword_spaces:
            "1"

        });

      }

      catch(parameterError) {

        console.log(
          "Parameter setting skipped:",
          parameterError
        );

      }


      /* -----------------------------------------
         RECOGNIZE
      ----------------------------------------- */

      progress.textContent =
        "🔍 Reading prescription...";


      const response =
        await worker.recognize(
          processedImage
        );


      /* -----------------------------------------
         GET TEXT
      ----------------------------------------- */

      let text =
        "";


      if (
        response &&
        response.data &&
        response.data.text
      ) {

        text =
          response.data.text
            .replace(
              /\r/g,
              ""
            )
            .replace(
              /\n{3,}/g,
              "\n\n"
            )
            .trim();

      }


      /* -----------------------------------------
         RESULT
      ----------------------------------------- */

      if (text.length > 0) {

        result.value =
          text;


        progress.textContent =
          "✅ OCR completed successfully.";


        detectMedicines(
          text
        );

      }

      else {

        result.value =
          "No readable text was detected.\n\n" +
          "Please try a clearer or higher-quality prescription image.";


        progress.textContent =
          "⚠️ No readable text found.";

      }


      /* -----------------------------------------
         TERMINATE WORKER
      ----------------------------------------- */

      await worker.terminate();

    }


    catch(error) {


      console.error(
        "OCR ERROR:",
        error
      );


      const message =
        error &&
        error.message
          ? error.message
          : String(error);


      result.value =
        "OCR failed.\n\n" +
        message;


      progress.textContent =
        "❌ OCR failed.";


      showError(
        message
      );

    }


    finally {

      ocrBtn.disabled =
        false;

    }

  }
);



/* =====================================================
   DETECT MEDICINES
===================================================== */

function detectMedicines(text) {


  medicineList.innerHTML =
    "";


  const lines =
    text
      .split("\n")
      .map(
        function(line) {
          return line.trim();
        }
      )
      .filter(
        function(line) {
          return line.length > 2;
        }
      );


  const medicineWords = [

    "tab",

    "tablet",

    "cap",

    "capsule",

    "syrup",

    "susp",

    "suspension",

    "injection",

    "cream",

    "ointment",

    "drops",

    "mg",

    "ml",

    "mcg"

  ];


  const possibleMedicines =
    [];


  lines.forEach(
    function(line) {

      const lower =
        line.toLowerCase();


      const looksLikeMedicine =
        medicineWords.some(
          function(word) {

            return lower.includes(
              word
            );

          }
        );


      if (
        looksLikeMedicine
      ) {

        possibleMedicines.push(
          line
        );

      }

    }
  );


  /*
    Remove duplicates
  */

  const uniqueMedicines =
    [
      ...new Set(
        possibleMedicines
      )
    ];


  if (
    uniqueMedicines.length ===
    0
  ) {

    return;

  }


  medicineBox.style.display =
    "block";


  uniqueMedicines.forEach(
    function(item) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "medicine";


      div.textContent =
        "💊 " + item;


      medicineList.appendChild(
        div
      );

    }
  );

}



/* =====================================================
   COPY TEXT
===================================================== */

copyBtn.addEventListener(
  "click",
  async function() {


    const text =
      result.value.trim();


    if (!text) {

      alert(
        "There is no OCR text to copy."
      );

      return;

    }


    try {


      /*
        Modern clipboard
      */

      await navigator.clipboard.writeText(
        text
      );


      copyBtn.textContent =
        "✅ Copied!";


    }

    catch(error) {


      /*
        Fallback
      */

      result.removeAttribute(
        "readonly"
      );


      result.select();


      document.execCommand(
        "copy"
      );


      result.setAttribute(
        "readonly",
        "readonly"
      );


      copyBtn.textContent =
        "✅ Copied!";

    }


    setTimeout(
      function() {

        copyBtn.textContent =
          "📋 Copy Text";

      },
      2000
    );

  }
);


</script>


</body>

</html>
