<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedAssist - Smart Medicine Assistant</title>

    <!-- Tesseract.js OCR Engine -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f8fb;
            color: #1f2937;
        }

        .header {
            background: #0b8f87;
            color: white;
            padding: 28px 20px;
            text-align: center;
            border-radius: 0 0 25px 25px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 24px 18px;
        }

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h2 {
            font-size: 22px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .icon {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .card h3 {
            margin-bottom: 7px;
        }

        .card p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #0b8f87;
            color: white;
        }

        button.secondary {
            background: #e8f4f3;
            color: #08756f;
            margin-top: 10px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        #previewContainer {
            display: none;
            margin-top: 18px;
        }

        #previewImage {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            background: #f8fafc;
        }

        #ocrSection {
            display: none;
            margin-top: 18px;
        }

        #ocrResult {
            width: 100%;
            min-height: 220px;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            resize: vertical;
            font-size: 15px;
            line-height: 1.6;
            font-family: Arial, sans-serif;
        }

        .status {
            display: none;
            margin-top: 15px;
            padding: 13px;
            border-radius: 12px;
            background: #eef6ff;
            color: #315b85;
            text-align: center;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }

        .progressBar {
            height: 100%;
            width: 0%;
            background: #0b8f87;
            transition: width 0.3s ease;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            padding: 20px;
        }

        .note {
            background: #fff8e1;
            color: #795548;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 12px;
        }

        .success {
            background: #e8f7ef;
            color: #176b3a;
        }

        .error {
            background: #fff0f0;
            color: #a12626;
        }
    </style>
</head>

<body>

<header class="header">
    <h1>💊 MedAssist</h1>
    <p>Your Smart Medicine Assistant</p>
</header>


<main class="container">

    <section class="welcome">
        <h2>Welcome to MedAssist</h2>

        <p>
            Understand your prescription and medicine information more easily.
        </p>
    </section>


    <!-- ========================= -->
    <!-- PRESCRIPTION OCR -->
    <!-- ========================= -->

    <div class="card">

        <div class="icon">🖼️</div>

        <h3>Prescription OCR</h3>

        <p>
            Select a prescription image from your phone gallery.
        </p>


        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            onchange="imageSelected(event)"
        >


        <button onclick="openGallery()">
            📷 Choose Prescription Image
        </button>


        <!-- IMAGE PREVIEW -->

        <div id="previewContainer">

            <h3 style="margin: 15px 0 10px;">
                Image Preview
            </h3>

            <img
                id="previewImage"
                alt="Prescription preview"
            >


            <button
                id="ocrButton"
                onclick="startOCR()"
                style="margin-top: 12px;"
            >
                🔍 Start OCR
            </button>


            <button
                class="secondary"
                onclick="clearImage()"
            >
                ✕ Choose Another Image
            </button>

        </div>


        <!-- OCR STATUS -->

        <div id="ocrStatus" class="status">

            Preparing OCR...

            <
