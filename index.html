<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MedAssist - Prescription OCR</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7fbfc;
      color: #173b3d;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 16px 40px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
      color: #087f7b;
    }

    .image-box {
      background: white;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    #preview {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 18px;
      display: none;
    }

    .upload-label {
      display: block;
      background: #e7f5f6;
      color: #087f7b;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #imageInput {
      display: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 18px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #ocrBtn {
      background: #109b96;
      color: white;
    }

    #ocrBtn:disabled {
      background: #8abfbd;
      cursor: not-allowed;
    }

    #chooseBtn {
      background: #e7f5f6;
      color: #087f7b;
    }

    .result-title {
      margin-top: 28px;
      font-size: 24px;
      font-weight: bold;
    }

    #result {
      width: 100%;
      min-height: 220px;
      margin-top: 12px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 18px;
      background: white;
      font-size: 17px;
      line-height: 1.7;
      resize: vertical;
      white-space: pre-wrap;
    }

    #progress {
      margin-top: 12px;
      text-align: center;
      color: #087f7b;
      font-weight: bold;
      min-height: 24px;
    }

    #copyBtn {
      background: #e7f5f6;
      color: #087f7b;
    }

    .medicine-box {
      display: none;
      margin-top: 20px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .medicine-box h3 {
      margin-top: 0;
      color: #087f7b;
    }

    .medicine {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      padding: 12px;
      background: #fff8e1;
      border-radius: 12px;
      font-size: 13px;
      color: #665500;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💊 MedAssist</h1>

  <div class="image-box">

    <label class="upload-label" for="imageInput">
      📷 Choose Prescription Image
    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
    >

    <img id="preview" alt="Prescription Preview">

  </div>

  <button id="ocrBtn" disabled>
    🔍 Start OCR
  </button>

  <button id="chooseBtn">
    ✕ Choose Another Image
  </button>

  <div id="progress"></div>

  <div class="result-title">
    📝 OCR Result
  </div>

  <textarea
    id="result"
    placeholder="OCR result will appear here..."
    readonly
  ></textarea>

  <button id="copyBtn">
    📋 Copy Text
  </button>

  <div class="medicine-box" id="medicineBox">
    <h3>💊 Detected Medicines</h3>
    <div id="medicineList"></div>
  </div>

  <div class="note">
    ⚠️ OCR শুধু prescription-এর লেখা শনাক্ত করার জন্য।
    Medicine বা dosage নেওয়ার আগে অবশ্যই registered doctor/pharmacist-এর
    prescription যাচাই করুন।
  </div>

</div>


<script>

  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const ocrBtn = document.getElementById("ocrBtn");
  const chooseBtn = document.getElementById("chooseBtn");
  const result = document.getElementById("result");
  const progress = document.getElementById("progress");
  const copyBtn = document.getElementById("copyBtn");

  const medicineBox = document.getElementById("medicineBox");
  const medicineList = document.getElementById("medicineList");

  let selectedImage = null;


  // ------------------------------------
  // IMAGE SELECT
  // ------------------------------------

  imageInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    selectedImage = file;

    const imageURL = URL.createObjectURL(file);

    preview.src = imageURL;
    preview.style.display = "block";

    ocrBtn.disabled = false;

    result.value = "";

    progress.textContent = "✅ Image ready. Press Start OCR.";

    medicineBox.style.display = "none";
    medicineList.innerHTML = "";

  });


  // ------------------------------------
  // CHOOSE ANOTHER IMAGE
  // ------------------------------------

  chooseBtn.addEventListener("click", function() {

    imageInput.value = "";
    selectedImage = null;

    preview.src = "";
    preview.style.display = "none";

    result.value = "";

    progress.textContent = "";

    ocrBtn.disabled = true;

    medicineBox.style.display = "none";

  });


  // ------------------------------------
  // IMAGE PREPROCESSING
  // ------------------------------------

  function preprocessImage(file) {

    return new Promise((resolve, reject) => {

      const img = new Image();

      img.onload = function() {

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        let width = img.width;
        let height = img.height;

        // Increase image resolution for OCR
        const maxWidth = 1800;

        if (width > maxWidth) {

          const ratio = maxWidth / width;

          width = maxWidth;
          height = height * ratio;

        }

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(img, 0, 0, width, height);

        const imageData =
          ctx.getImageData(0, 0, width, height);

        const data = imageData.data;

        // Grayscale + contrast
        for (let i = 0; i < data.length; i += 4) {

          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;

          // Increase contrast
          gray = ((gray - 128) * 1.35) + 128;

          gray = Math.max(0, Math.min(255, gray));

          data[i] = gray;
          data[i + 1] = gray;
          data[i + 2] = gray;

        }

        ctx.putImageData(imageData, 0, 0);

        resolve(canvas.toDataURL("image/jpeg", 0.95));

      };

      img.onerror = reject;

      img.src = URL.createObjectURL(file);

    });

  }


  // ------------------------------------
  // START OCR
  // ------------------------------------

  ocrBtn.addEventListener("click", async function() {

    if (!selectedImage) {

      alert("Please choose a prescription image first.");

      return;

    }

    ocrBtn.disabled = true;

    result.value = "";

    progress.textContent =
      "⏳ Preparing prescription image...";

    try {

      const processedImage =
        await preprocessImage(selectedImage);

      progress.textContent =
        "🔍 Starting OCR... Please wait.";

      // Create Tesseract worker
      const worker = await Tesseract.createWorker(
        "eng+ben",
        1,
        {
          logger: function(info) {

            if (info.status) {

              let percent = "";

              if (typeof info.progress === "number") {

                percent =
                  " " +
                  Math.round(info.progress * 100) +
                  "%";

              }

              progress.textContent =
                "🔍 " +
                info.status +
                percent;

            }

          }
        }
      );

      // OCR
      const { data } =
        await worker.recognize(processedImage);

      const text =
        data.text
          .replace(/\n{3,}/g, "\n\n")
          .trim();

      if (text) {

        result.value = text;

        progress.textContent =
          "✅ OCR completed successfully.";

        detectMedicines(text);

      } else {

        result.value =
          "No readable text was detected.\n\n" +
          "Please try a clearer prescription image.";

        progress.textContent =
          "⚠️ No readable text found.";

      }

      await worker.terminate();

    }

    catch (error) {

      console.error(error);

      result.value =
        "OCR failed.\n\n" +
        "Please check your internet connection and try again.\n\n" +
        "Error: " +
        error.message;

      progress.textContent =
        "❌ OCR error.";

    }

    finally {

      ocrBtn.disabled = false;

    }

  });


  // ------------------------------------
  // MEDICINE DETECTION
  // ------------------------------------

  function detectMedicines(text) {

    medicineList.innerHTML = "";

    const lines =
      text
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 2);

    const possibleMedicines = [];

    lines.forEach(line => {

      const lower = line.toLowerCase();

      // Common medicine indicators
      const medicineWords = [
        "tab",
        "tablet",
        "cap",
        "capsule",
        "syrup",
        "susp",
        "injection",
        "cream",
        "ointment",
        "mg",
        "ml"
      ];

      const looksLikeMedicine =
        medicineWords.some(word =>
          lower.includes(word)
        );

      if (looksLikeMedicine) {

        possibleMedicines.push(line);

      }

    });


    // Remove duplicates
    const uniqueMedicines =
      [...new Set(possibleMedicines)];


    if (uniqueMedicines.length > 0) {

      medicineBox.style.display = "block";

      uniqueMedicines.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "medicine";

        div.textContent = "💊 " + item;

        medicineList.appendChild(div);

      });

    }

  }


  // ------------------------------------
  // COPY OCR TEXT
  // ------------------------------------

  copyBtn.addEventListener("click", async function() {

    const text = result.value.trim();

    if (!text) {

      alert("There is no OCR text to copy.");

      return;

    }

    try {

      await navigator.clipboard.writeText(text);

      copyBtn.textContent =
        "✅ Copied!";

      setTimeout(() => {

        copyBtn.textContent =
          "📋 Copy Text";

      }, 2000);

    }

    catch (error) {

      result.select();

      document.execCommand("copy");

      copyBtn.textContent =
        "✅ Copied!";

      setTimeout(() => {

        copyBtn.textContent =
          "📋 Copy Text";

      }, 2000);

    }

  });

</script>

</body>
</html>
